<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALIMA 2K26 - Public Live Results</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Cinzel:wght@700;900&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1510; color: #f1f5f9; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .bg-pattern {
      background-color: #0b1510;
      background-image: radial-gradient(rgba(202, 138, 4, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }
  </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-black">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 bg-[#0e1d16]/90 backdrop-blur-md border-b border-amber-500/20 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-black text-lg shadow-md shadow-amber-500/20">
          🏆
        </div>
        <div>
          <h1 id="event-title" class="font-cinzel font-black text-amber-300 text-sm sm:text-base tracking-wider uppercase">
            KALIMA 2K26 MEELAD FEST
          </h1>
          <p id="event-subtitle" class="text-[11px] text-emerald-300/80 font-medium">
            Live Official Results & Standings
          </p>
        </div>
      </div>

      <!-- Sync Status & Refresh -->
      <div class="flex items-center gap-2">
        <span id="sync-badge" class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-950/80 text-emerald-300 border border-emerald-500/40">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Sync
        </span>
        <button id="btn-refresh" onclick="fetchLiveData(true)" class="px-3 py-1.5 bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 text-xs font-bold rounded-xl transition-all active:scale-95 flex items-center gap-1.5">
          <i class="fa-solid fa-rotate text-xs"></i> <span>Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- TEAMS SCOREBOARD PODIUM / CARDS -->
    <section id="section-scoreboard" class="bg-[#12231b] border border-amber-500/20 rounded-3xl p-5 md:p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-amber-500/15 pb-3">
        <h2 class="text-xs font-extrabold uppercase tracking-widest text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-chart-simple"></i> Team Standings (Scoreboard)
        </h2>
        <span id="total-results-count" class="text-[11px] font-mono text-emerald-300 bg-emerald-950 px-2 py-0.5 rounded-lg border border-emerald-500/30">
          0 Results Published
        </span>
      </div>

      <div id="teams-container" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <!-- Teams dynamically loaded -->
        <div class="animate-pulse bg-slate-900/60 p-4 rounded-2xl border border-slate-800 text-center">Loading teams...</div>
      </div>
    </section>

    <!-- SEARCH & FILTER BAR -->
    <section class="bg-[#12231b] border border-amber-500/20 rounded-2xl p-4 shadow-lg space-y-3">
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search by Competition, Winner Name, or Team..." 
            oninput="handleFilterChange()"
            class="w-full bg-[#0a1611] border border-slate-700/80 rounded-xl pl-9 pr-4 py-2.5 text-xs sm:text-sm text-white placeholder-slate-400 focus:outline-none focus:border-amber-400 transition-colors"
          />
        </div>

        <div class="flex gap-2 shrink-0">
          <select id="filter-gender" onchange="handleFilterChange()" class="bg-[#0a1611] border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 font-semibold focus:outline-none focus:border-amber-400">
            <option value="All">All Sections (Boys & Girls)</option>
            <option value="Boys">👦 Boys Section Only</option>
            <option value="Girls">👧 Girls Section Only</option>
            <option value="General">👥 General / Group Only</option>
          </select>

          <select id="filter-category" onchange="handleFilterChange()" class="bg-[#0a1611] border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 font-semibold focus:outline-none focus:border-amber-400">
            <option value="All">All Age Categories</option>
            <option value="Kids">🧒 Kids (Class 1-2)</option>
            <option value="Sub Junior">🎒 Sub-Junior (Class 3-4)</option>
            <option value="Junior">⭐ Junior (Class 5-6)</option>
            <option value="Senior">🔥 Senior (Class 7-8)</option>
            <option value="Super Senior">🎓 Super Senior (Class 9-12)</option>
            <option value="General">🌐 General Category</option>
          </select>
        </div>
      </div>
    </section>

    <!-- HIERARCHICAL PUBLISHED RESULTS VIEW -->
    <section class="space-y-4">
      <div class="flex items-center justify-between px-1">
        <h3 class="font-extrabold text-sm uppercase tracking-wider text-amber-300 flex items-center gap-2">
          <i class="fa-solid fa-trophy text-amber-400"></i> Official Competition Results
        </h3>
        <span id="filtered-count" class="text-xs text-slate-400">Showing all</span>
      </div>

      <!-- Results Container (Hierarchical Block-by-Block Format) -->
      <div id="results-hierarchy-container" class="space-y-5">
        <div class="text-center py-12 bg-[#12231b]/50 rounded-3xl border border-slate-800">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-amber-400 mb-2"></i>
          <p class="text-xs text-slate-400">Loading competition results...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-[#0e1d16] border-t border-slate-800 text-center py-4 px-4 text-xs text-slate-400">
    <p><span class="font-cinzel font-bold text-amber-400">KALIMA 2K26 MEELAD FEST</span> &bull; Real-time Synchronization Active</p>
  </footer>

  <!-- SCRIPT LOGIC -->
  <script>
    // Config: Apps Script Web App URL (can be customized or read from localStorage)
    const APPS_SCRIPT_URL_KEY = 'mrms_apps_script_url';
    let appsScriptUrl = localStorage.getItem(APPS_SCRIPT_URL_KEY) || '';

    let localDb = {
      teams: [],
      programs: [],
      participants: [],
      results: [],
      settings: {
        eventName: 'KALIMA 2K26 MEELAD FEST',
        boardName: 'LIVE SCOREBOARD',
        subtitle: 'Live Competition Results, Scoring Points & Schedules'
      }
    };

    // Category display order & definitions
    const CATEGORIES = ['Kids', 'Sub Junior', 'Junior', 'Senior', 'Super Senior', 'General'];
    const CATEGORY_NAMES = {
      'Kids': '🧒 Kids Category (Class 1-2)',
      'Sub Junior': '🎒 Sub-Junior Category (Class 3-4)',
      'Junior': '⭐ Junior Category (Class 5-6)',
      'Senior': '🔥 Senior Category (Class 7-8)',
      'Super Senior': '🎓 Super Senior Category (Class 9-12)',
      'General': '🌐 General Category (Open)',
      'All': '🌐 All Classes'
    };

    async function fetchLiveData(showFeedback = false) {
      const btnRefresh = document.getElementById('btn-refresh');
      if (btnRefresh && showFeedback) {
        btnRefresh.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>Syncing...</span>';
      }

      try {
        // Try local storage first for instant rendering
        const cached = localStorage.getItem('fest_portal_db_v1');
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed && Array.isArray(parsed.teams)) {
              localDb = parsed;
              renderUI();
            }
          } catch(e) {}
        }

        // Fetch from Google Apps Script Web App if URL is set
        if (appsScriptUrl) {
          const res = await fetch(appsScriptUrl + (appsScriptUrl.includes('?') ? '&' : '?') + 'action=read&t=' + Date.now());
          const json = await res.json();
          if (json && json.status === 'success' && json.db) {
            localDb = json.db;
            localStorage.setItem('fest_portal_db_v1', JSON.stringify(localDb));
            renderUI();
          }
        }
      } catch (err) {
        console.warn('Sync warning:', err);
      } finally {
        if (btnRefresh) {
          btnRefresh.innerHTML = '<i class="fa-solid fa-rotate text-xs"></i> <span>Refresh</span>';
        }
      }
    }

    function renderUI() {
      // 1. Update Title & Subtitle
      if (localDb.settings) {
        if (localDb.settings.eventName) document.getElementById('event-title').innerText = localDb.settings.eventName;
        if (localDb.settings.subtitle) document.getElementById('event-subtitle').innerText = localDb.settings.subtitle;
      }

      // 2. Render Scoreboard
      renderScoreboard();

      // 3. Render Hierarchical Results
      renderHierarchicalResults();
    }

    function renderScoreboard() {
      const container = document.getElementById('teams-container');
      const teams = localDb.teams || [];
      document.getElementById('total-results-count').innerText = (localDb.results?.length || 0) + ' Results Published';

      if (!teams.length) {
        container.innerHTML = '<div class="col-span-4 text-center text-xs text-slate-500 py-4">No team data available</div>';
        return;
      }

      // Sort teams descending by points
      const sortedTeams = [...teams].sort((a, b) => (b.points || 0) - (a.points || 0));

      container.innerHTML = sortedTeams.map((t, idx) => {
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
        const borderClass = idx === 0 ? 'border-amber-400/60 bg-amber-500/10' : 'border-slate-800 bg-[#0a1611]';
        return `
          <div class="p-3 rounded-2xl border ${borderClass} shadow-md flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-sm font-black">${medal}</span>
              <div class="min-w-0">
                <p class="font-extrabold text-xs text-white truncate">${t.name}</p>
                <p class="text-[10px] text-slate-400 truncate">${t.captain ? 'Capt: ' + t.captain : 'Team ' + (t.symbol || '')}</p>
              </div>
            </div>
            <div class="text-right shrink-0">
              <span class="font-mono font-black text-amber-300 text-sm md:text-base">${t.points || 0}</span>
              <span class="text-[9px] text-slate-400 block -mt-1 font-bold">PTS</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleFilterChange() {
      renderHierarchicalResults();
    }

    function renderHierarchicalResults() {
      const container = document.getElementById('results-hierarchy-container');
      const search = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const filterGender = document.getElementById('filter-gender').value;
      const filterCategory = document.getElementById('filter-category').value;

      const programs = localDb.programs || [];
      const results = localDb.results || [];
      const teams = localDb.teams || [];
      const teamMap = {};
      teams.forEach(t => { teamMap[t.id] = t.name; });

      // Group all results by Program ID
      const progResultsMap = new Map();
      results.forEach(res => {
        const list = progResultsMap.get(res.programId) || [];
        list.push(res);
        progResultsMap.set(res.programId, list);
      });

      // Filter and build program blocks
      const renderedBlocks = [];

      programs.forEach(prog => {
        const progResults = progResultsMap.get(prog.id) || [];
        if (progResults.length === 0) return; // Skip programs with 0 published results

        // Check if any results match active filters
        const matchingResults = progResults.filter(r => {
          if (filterGender !== 'All' && r.gender !== filterGender) return false;
          if (filterCategory !== 'All' && r.age !== filterCategory) return false;
          
          if (search) {
            const matchesProg = prog.name.toLowerCase().includes(search) || (prog.code && prog.code.toLowerCase().includes(search));
            const checkWinner = (arr) => (arr || []).some(w => 
              (w.name && w.name.toLowerCase().includes(search)) || 
              (w.teamId && teamMap[w.teamId] && teamMap[w.teamId].toLowerCase().includes(search))
            );
            const matchesWinner = checkWinner(r.winners?.first) || checkWinner(r.winners?.second) || checkWinner(r.winners?.third);
            if (!matchesProg && !matchesWinner) return false;
          }
          return true;
        });

        if (matchingResults.length === 0) return;

        // Group by Age Category
        const catsMap = new Map();
        CATEGORIES.forEach(c => catsMap.set(c, []));
        catsMap.set('All', []);

        matchingResults.forEach(r => {
          const catKey = r.age || 'General';
          const list = catsMap.get(catKey) || [];
          list.push(r);
          catsMap.set(catKey, list);
        });

        // Build HTML for each Category Block
        let categoriesHtml = '';

        catsMap.forEach((catResults, catName) => {
          if (catResults.length === 0) return;

          const boysRes = catResults.filter(r => r.gender === 'Boys');
          const girlsRes = catResults.filter(r => r.gender === 'Girls');
          const genRes = catResults.filter(r => r.gender === 'General');

          categoriesHtml += `
            <div class="mt-3 pt-3 border-t border-slate-800/80">
              <div class="flex items-center gap-2 mb-2.5">
                <span class="px-2.5 py-0.5 rounded-md text-[11px] font-black bg-amber-500/15 text-amber-300 border border-amber-500/30">
                  ${CATEGORY_NAMES[catName] || catName}
                </span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Boys Section -->
                ${boysRes.length > 0 ? `
                  <div class="bg-[#0a1611] border border-sky-500/30 rounded-2xl p-3.5 space-y-2">
                    <div class="flex items-center justify-between pb-1.5 border-b border-sky-500/20 text-xs font-bold text-sky-400">
                      <span>👦 Boys Section (ആൺകുട്ടികൾ)</span>
                      <span class="text-[10px] bg-sky-950 px-2 py-0.5 rounded-full border border-sky-500/30 font-mono">1st, 2nd, 3rd</span>
                    </div>
                    ${renderWinnersList(boysRes[0]?.winners, teamMap)}
                  </div>
                ` : ''}

                <!-- Girls Section -->
                ${girlsRes.length > 0 ? `
                  <div class="bg-[#0a1611] border border-fuchsia-500/30 rounded-2xl p-3.5 space-y-2">
                    <div class="flex items-center justify-between pb-1.5 border-b border-fuchsia-500/20 text-xs font-bold text-fuchsia-400">
                      <span>👧 Girls Section (പെൺകുട്ടികൾ)</span>
                      <span class="text-[10px] bg-fuchsia-950 px-2 py-0.5 rounded-full border border-fuchsia-500/30 font-mono">1st, 2nd, 3rd</span>
                    </div>
                    ${renderWinnersList(girlsRes[0]?.winners, teamMap)}
                  </div>
                ` : ''}

                <!-- General / Group Section (if any) -->
                ${genRes.length > 0 ? `
                  <div class="bg-[#0a1611] border border-emerald-500/30 rounded-2xl p-3.5 space-y-2 md:col-span-2">
                    <div class="flex items-center justify-between pb-1.5 border-b border-emerald-500/20 text-xs font-bold text-emerald-400">
                      <span>👥 General / Group Section</span>
                      <span class="text-[10px] bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-500/30 font-mono">1st, 2nd, 3rd</span>
                    </div>
                    ${renderWinnersList(genRes[0]?.winners, teamMap)}
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        });

        renderedBlocks.push(`
          <div class="bg-[#12231b] border border-amber-500/20 rounded-3xl p-5 shadow-xl transition-all hover:border-amber-500/40">
            <!-- Program Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <span class="px-2.5 py-1 bg-emerald-950 border border-emerald-500/40 text-emerald-300 font-mono font-black text-xs rounded-xl">
                  ${prog.code || 'CODE'}
                </span>
                <h4 class="font-extrabold text-base text-white tracking-wide">
                  ${prog.name}
                </h4>
              </div>
              <span class="text-[10px] text-slate-400 font-semibold self-start sm:self-auto bg-slate-900 px-2 py-0.5 rounded-lg border border-slate-800">
                ${prog.stageType || 'Main Stage'} &bull; ${prog.venue || 'Stage 1'}
              </span>
            </div>

            <!-- Categories and Gender Blocks -->
            ${categoriesHtml}
          </div>
        `);
      });

      if (renderedBlocks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-[#12231b]/40 rounded-3xl border border-slate-800/80 p-6 space-y-2">
            <p class="text-2xl">🔍</p>
            <p class="text-xs font-bold text-slate-300">No published results match your search or filter</p>
            <p class="text-[11px] text-slate-500">Try changing or clearing your search term</p>
          </div>
        `;
      } else {
        container.innerHTML = renderedBlocks.join('');
      }

      document.getElementById('filtered-count').innerText = `Showing ${renderedBlocks.length} competition(s)`;
    }

    function renderWinnersList(winners, teamMap) {
      if (!winners) return '<p class="text-xs text-slate-500">No winners declared</p>';

      const positions = [
        { key: 'first', label: '1st Place', icon: '🥇', color: 'text-amber-300', bg: 'bg-amber-500/10 border-amber-500/20' },
        { key: 'second', label: '2nd Place', icon: '🥈', color: 'text-slate-300', bg: 'bg-slate-500/10 border-slate-500/20' },
        { key: 'third', label: '3rd Place', icon: '🥉', color: 'text-amber-600', bg: 'bg-amber-700/10 border-amber-700/20' }
      ];

      return positions.map(pos => {
        const entries = winners[pos.key] || [];
        if (entries.length === 0) {
          return `
            <div class="flex items-center justify-between text-xs py-1 px-2.5 rounded-xl ${pos.bg} border opacity-50">
              <span class="flex items-center gap-1.5 font-bold ${pos.color}">${pos.icon} ${pos.label}</span>
              <span class="text-[11px] text-slate-500 italic">— Not declared —</span>
            </div>
          `;
        }

        return entries.map(w => {
          const tName = w.teamId ? (teamMap[w.teamId] || w.teamId) : 'Independent';
          return `
            <div class="flex items-center justify-between text-xs py-1.5 px-2.5 rounded-xl ${pos.bg} border">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-sm shrink-0">${pos.icon}</span>
                <div class="min-w-0">
                  <p class="font-extrabold text-xs text-white truncate">${w.name || 'Unknown'}</p>
                  <p class="text-[10px] text-amber-200/80 font-medium truncate">${tName}</p>
                </div>
              </div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-black/40 text-amber-300 font-mono shrink-0 ml-2">
                ${pos.label}
              </span>
            </div>
          `;
        }).join('');
      }).join('');
    }

    // Auto sync on page load and periodically every 15 seconds
    fetchLiveData();
    setInterval(() => fetchLiveData(false), 15000);
  </script>
</body>
</html>
